services:
  - type: web
    name: masterly-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: masterly-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: COMMISSION_PERCENT
        value: "15"
      - key: MIN_WITHDRAWAL
        value: "50000"

databases:
  - name: masterly-db
    plan: basic-256mb
    databaseName: masterly
    user: masterly
